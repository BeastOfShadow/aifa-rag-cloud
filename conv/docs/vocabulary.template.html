<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabolario AIFA</title>
<style>
:root{--bg:#fbfaf8;--panel:#fff;--ink:#1c1b1a;--ink2:#5d5a55;--line:#e6e2db;--bar:#2a6f97;--bar2:#a3b8c8;--acc:#b5532a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171615;--panel:#201f1d;--ink:#eeebe6;--ink2:#a9a49b;--line:#34312d;--bar:#6aa6cc;--bar2:#3d5566;--acc:#e08a5e}}
:root[data-theme=dark]{--bg:#171615;--panel:#201f1d;--ink:#eeebe6;--ink2:#a9a49b;--line:#34312d;--bar:#6aa6cc;--bar2:#3d5566;--acc:#e08a5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:0 0 22px;max-width:70ch}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
select,input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:120px;text-transform:none;letter-spacing:0}
label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;padding-bottom:7px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink2);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:15px;margin:0 0 2px}
.card p{margin:0 0 10px;color:var(--ink2);font-size:13px}
.row{display:grid;grid-template-columns:minmax(90px,200px) 1fr 74px;gap:8px;align-items:center;padding:2px 0;font-size:14px}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .b{height:14px;background:var(--bar2);border-radius:0 4px 4px 0;position:relative}
.row .b i{position:absolute;inset:0 auto 0 0;background:var(--bar);border-radius:0 4px 4px 0}
.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.row:hover{background:color-mix(in srgb,var(--bar) 8%,transparent)}
.hrow{display:grid;grid-template-columns:78px 1fr 70px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.hrow .b{height:16px;background:var(--bar2);border-radius:0 4px 4px 0}
.hrow .b i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.hrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.note{color:var(--ink2);font-size:12.5px;margin-top:14px}
.empty{color:var(--ink2);padding:18px 0}
</style>
</head>
<body>
<main>
<h1>Vocabolario del corpus AIFA</h1>
<p class="sub">Parole, coppie e terne di parole dei Foglietti illustrativi (FI) e dei Riassunti delle caratteristiche del prodotto (RCP), per sezione standard. Barre lunghe = più usate.</p>

<div class="controls">
  <label>Documento<select id="tipo"></select></label>
  <label>Sezione<select id="sec"></select></label>
  <label>Lunghezza<select id="n"><option value="1">Parole</option><option value="2">Coppie di parole</option><option value="3">Terne di parole</option></select></label>
  <label>Conta<select id="metric"><option value="df">Documenti in cui compare</option><option value="tf">Occorrenze totali</option></select></label>
  <label>Quante<select id="top"><option>25</option><option selected>50</option><option>100</option><option>200</option><option>300</option></select></label>
  <label>Ordine<select id="order"><option value="asc">Crescente</option><option value="desc">Decrescente</option></select></label>
  <label>Cerca<input id="q" type="search" placeholder="es. pazienti"></label>
  <label class="chk"><input id="stop" type="checkbox" checked> Nascondi parole vuote (di, il, che…)</label>
</div>

<div class="stats" id="stats"></div>

<div class="grid">
  <div class="card"><h2 id="listTitle"></h2><p id="listSub"></p><div id="list"></div></div>
  <div class="card"><h2>Quante parole hanno poche o tante presenze</h2><p id="histSub"></p><div id="hist"></div></div>
</div>
<p class="note" id="note"></p>
</main>
<script>
const D = /*DATA*/null;
const STOP = new Set("di a da in con su per tra fra il lo la i gli le un uno una e ed o ma se che chi cui non è sono può possono al allo alla ai agli alle dal dallo dalla dai dagli dalle del dello della dei degli delle nel nello nella nei negli nelle sul sullo sulla sui sugli sulle come più anche ha hanno essere stato stata stati state viene vengono deve devono questo questa questi queste quello quella sia dopo prima durante tutti tutte ogni altri altre altro altra loro suo sua suoi sue ad ne si lei lui li mg ml".split(" "));
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("it-IT");
const tipoName = {RCP:"RCP (per il medico)", FI:"FI (per il paziente)"};
$("tipo").innerHTML = Object.keys(D.data).map(t => `<option value="${t}">${tipoName[t]||t}</option>`).join("");

function fillSections(){
  const t = $("tipo").value, s = D.sections[t];
  $("sec").innerHTML = '<option value="all">Tutte le sezioni</option>' + Object.keys(s).map(k =>
    `<option value="${k}">${k === "pre" ? "Intestazione (prima della sezione 1)" : "Sezione " + k}</option>`).join("");
}
const allStop = term => term.split(" ").every(w => STOP.has(w));

function render(){
  const t = $("tipo").value, s = $("sec").value, n = $("n").value, d = D.data[t][s][n];
  const isAll = s === "all", tfOk = n === "1";
  $("metric").querySelector('[value=tf]').disabled = !tfOk;
  let metric = $("metric").value; if (!tfOk) { metric = "df"; $("metric").value = "df"; }
  const q = $("q").value.trim().toLowerCase(), N = +$("top").value, hide = $("stop").checked;
  let rows = d.top.map(r => ({term: r[0], df: r[1], tf: r[2]})).filter(r => (!hide || !allStop(r.term)) && (!q || r.term.includes(q)));
  rows.sort((a, b) => b[metric] - a[metric] || (a.term < b.term ? -1 : 1));
  rows = rows.slice(0, N);
  const max = Math.max(1, ...rows.map(r => r[metric]));
  if ($("order").value === "asc") rows.reverse();
  const docs = isAll ? D.docs[t] : D.sections[t][s][0];
  const unit = metric === "tf" ? "occorrenze" : (isAll ? "presenze nelle sezioni" : "documenti");
  $("listTitle").textContent = `${rows.length} ${["parole","coppie di parole","terne di parole"][n-1]} più usate`;
  $("listSub").textContent = `${tipoName[t]} · ${isAll ? "tutte le sezioni" : "sezione " + s} · valore = ${unit}` +
    (metric === "df" && !isAll ? ` (su ${fmt(docs)} documenti)` : "");
  $("list").innerHTML = rows.length ? rows.map(r => {
    const v = r[metric], pct = metric === "df" && !isAll ? ` title="${(100 * v / docs).toFixed(1)}% dei documenti"` : "";
    return `<div class="row"${pct}><span class="t">${r.term}</span><span class="b"><i style="width:${100 * v / max}%"></i></span><span class="v">${fmt(v)}</span></div>`;
  }).join("") : '<div class="empty">Nessun risultato.</div>';

  const labels = D.bins.map((b, i) => i + 1 < D.bins.length ? `${fmt(b)}–${fmt(D.bins[i + 1] - 1)}` : `${fmt(b)}+`);
  const hmax = Math.log10(Math.max(...d.hist) + 1) || 1;
  $("hist").innerHTML = d.hist.map((c, i) => `<div class="hrow"><span>${labels[i]}</span><span class="b"><i style="width:${100 * Math.log10(c + 1) / hmax}%"></i></span><span class="v">${fmt(c)}</span></div>`).join("");
  $("histSub").textContent = `Numero di ${["parole","coppie","terne"][n-1]} distinte per intervallo di ${isAll ? "presenze nelle sezioni" : "documenti"} (barre in scala logaritmica).`;
  const ss = D.sections[t], words = isAll ? Object.values(ss).reduce((a, b) => a + b[1], 0) : ss[s][1];
  $("stats").innerHTML = [[fmt(d.distinct), `${["parole","coppie","terne"][n-1]} distinte nel vocabolario`],
    [fmt(docs), isAll ? "documenti" : "documenti con questa sezione"], [fmt(words), "parole in totale"],
    [fmt(rows.length ? max : 0), "valore più alto mostrato"]]
    .map(x => `<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
  $("note").textContent = "Il vocabolario tiene solo i termini frequenti: parole in almeno 5 documenti, coppie e terne in almeno 20. " +
    "Con 'Tutte le sezioni' i documenti si contano una volta per sezione. La ricerca guarda solo ai 300 termini più usati di ogni vista.";
}
$("tipo").onchange = () => { fillSections(); render(); };
["sec","n","metric","top","order","stop"].forEach(i => $(i).onchange = render);
$("q").oninput = render;
fillSections(); render();
</script>
</body>
</html>
